[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-lipsync-video-generator"
version = "0.6.3"
description = "Plugin-host desktop tool for AI-driven lip-sync video generation."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
authors = [{ name = "ai-lipsync-video-generator contributors" }]
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python>=4.9",
    "soundfile>=0.12",
    "onnxruntime-gpu>=1.17; platform_system=='Windows'",
    "pydantic>=2.6",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]
cu121 = ["torch>=2.3", "torchaudio>=2.3"]

[project.scripts]
lipsync-host = "lipsync_host.__main__:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
    "lipsync_host*",
    "core*",
    "handlers*",
    "services*",
    "models*",
    "utils*",
    "config*",
    "plugins*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "core", "handlers", "services", "models", "utils", "config", "plugins"]